# FFN CP health policy.  Recovery RESETS the control plane, so it is off by
# default: a reset destroys in-progress hardware work (bcm.user, DP boot,
# oct-remote staging).  Turn it on only for unattended operation.
AUTO_RECOVER=no
DOWN_SAMPLES=4
RECOVER_MAX_PER_HOUR=2
# While doing hardware bring-up:  touch /run/ffn-cp-health.inhibit
