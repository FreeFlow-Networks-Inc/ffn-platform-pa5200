# Caching OpenWrt mirror for the OCTEON control plane.
#
# The CP reaches the world only across the PCIe virtual-ethernet link, and its
# address lives in 127/8, so routing it to the internet would mean relaxing
# martian-source handling on a firewall. Instead the MP proxies the feed: the CP
# talks plain HTTP to 127.1.1.1 and never has an internet path of its own.
#
# Plain HTTP is safe here because opkg keeps "option check_signature" and the
# release key d310c6f2833e97f7, so every Packages index is verified with usign
# end to end -- the proxy is a cache, not a trust boundary.
#
# Bound to 127.1.1.1 (ffnnet0) only: nothing is exposed on the management LAN.
proxy_cache_path /var/cache/ffn-owrt levels=1:2 keys_zone=owrt:16m
                 max_size=4g inactive=180d use_temp_path=off;

server {
    listen 127.1.1.1:8080;

    # IPv4 ONLY, and this is not a preference -- without it the mirror does not
    # work at all.
    #
    # With a literal hostname in proxy_pass, nginx resolves at config-load time
    # through the system resolver and keeps every address it gets. It got
    # downloads.openwrt.org's AAAA records and tried them:
    #
    #   connect() to [2a04:4e42:400::644]:443 failed (101: Unknown error)
    #   while connecting to upstream
    #
    # This host has no IPv6 route, so every fetch returned 502/404 and `opkg
    # update` failed on ALL SIX feeds -- while curl to the same URL from this
    # same host returned 200 over IPv4. That contrast is the whole diagnosis and
    # it is easy to misread as "the mirror is down" or "the CP has no network".
    #
    # Naming the resolver AND putting the host in a variable is what forces
    # runtime resolution -- with a literal, `resolver` is ignored entirely, so
    # adding ipv6=off alone would look right and change nothing.
    resolver 127.0.0.53 ipv6=off valid=300s;
    resolver_timeout 10s;
    set $owrt_upstream downloads.openwrt.org;
    server_name _;
    access_log /var/log/nginx/ffn-owrt.log;

    # Indexes and signatures: short TTL so a refreshed release is picked up.
    #
    # THE PREFIX MUST BE STRIPPED, and this block is why the mirror never
    # served an index. A regex location takes precedence over the `location
    # /openwrt/` prefix block below, so every Packages.gz request landed here --
    # and `$request_uri` is the ORIGINAL uri, /openwrt and all. Upstream
    # therefore saw
    #
    #   https://downloads.openwrt.org/openwrt/releases/24.10.4/.../Packages.gz
    #
    # and answered 404, for all six feeds, while the same URL fetched by hand
    # from this host returned 200. The prefix block gets this right by accident
    # of syntax: a trailing "/" on proxy_pass strips the matched prefix, which a
    # regex location cannot use -- so .ipk downloads would have worked and only
    # indexes failed, which reads like a stale or corrupt mirror rather than a
    # routing mistake.
    #
    # Named capture instead, appended explicitly.
    location ~ ^/openwrt/(?<owrt_path>.*/(Packages(\.gz|\.sig)?|index\.json))$ {
        proxy_pass https://$owrt_upstream/$owrt_path;
        proxy_set_header Host downloads.openwrt.org;
        proxy_ssl_server_name on;
        proxy_ssl_name downloads.openwrt.org;
        proxy_http_version 1.1;
        proxy_cache owrt;
        proxy_cache_valid 200 302 10m;
        proxy_cache_use_stale error timeout;
        add_header X-FFN-Cache $upstream_cache_status;
    }

    location /openwrt/ {
        # EXPLICIT rewrite, because proxy_pass carries a variable.
        #
        # nginx strips the matched location prefix automatically only when
        # proxy_pass ends in a literal URI. Put a variable in the host and that
        # rewriting stops, even with the trailing "/" still written -- so
        # /openwrt/releases/... was forwarded verbatim and openwrt.org answered
        # with an HTML page and status 200. opkg then reported
        #
        #   Checksum or size mismatch for package <name>
        #
        # because it had faithfully downloaded 9 KB of HTML instead of a 1.1 MB
        # .ipk. Nothing in that message points at the proxy, and a 200 hides it
        # from every status check.
        #
        # This was a regression from adding the ipv6=off resolver above: that
        # change required the variable, and the variable silently disabled the
        # rewrite this block depended on. Doing it explicitly is immune to both.
        rewrite ^/openwrt/(.*)$ /$1 break;
        proxy_pass https://$owrt_upstream;
        proxy_set_header Host downloads.openwrt.org;
        proxy_ssl_server_name on;
        proxy_ssl_name downloads.openwrt.org;
        proxy_http_version 1.1;

        # .ipk files are immutable once published, so cache them for a long
        # time. Indexes are NOT: Packages.gz/Packages.sig are rewritten when a
        # release is refreshed. Caching both for 180d served a stale index
        # against fresh .ipk files and opkg failed with
        #   Checksum or size mismatch for package <name>
        # which reads like a corrupt mirror. Split the validity by URI below.
        proxy_cache owrt;
        proxy_cache_valid 200 302 180d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;
        add_header X-FFN-Cache $upstream_cache_status;
    }
}
