# FFN: keep the journal across reboots on the plane processors.
#
# Both planes root over NFS and have no local disk, so the default
# Storage=auto only persists when /var/log/journal exists, which the image
# does not guarantee. The DP reset of 2026-10-10 left no cause on record
# until the previous boot's journal was found intact on the NFS root; this
# makes that guaranteed, bounds the space on the exported root, and rotates
# daily so a boot's last minutes sit in a small, recent file.
#
# journald on this NFS root logs "Failed to sync system journal, ignoring:
# Permission denied" every sync interval: the re-exported NFS commit is
# refused while fsync() from any other process succeeds, and every entry up
# to the second of a reset has been recovered, so the warning is noise.
# The kernel's own last words are still lost on a reset; netconsole over
# the CP-DP transport is the follow-up (see DP-JOURNAL.md).
[Journal]
Storage=persistent
SystemMaxUse=4G
SystemKeepFree=4G
MaxFileSec=1day
SyncIntervalSec=1min
