# FFN: the plane journal lives in RAM; the MP ships it to the 2 TB RAID.
#
# Both plane roots are NFS exports of the MP's system disk (the DP's nested
# through the CP). With Storage=persistent (50-ffn.conf) every log line became
# synchronous NFS writes on the control path and a 2.2 GB journal sat on the
# exported root; on 2026-10-14 write latency on that path averaged 66 ms and a
# saturated MP disk froze the dataplane's security runtime long enough for the
# transit gate to expire. The journal now stays in /run (bounded) and
# ffn-log-ship.timer on the MP pulls it into /opt/ffn-logs/journal/<plane>/
# every two minutes, so the RAID holds the history and the exported root
# takes no log writes. The last two minutes before a reset can be lost; the
# netconsole follow-up in DP-JOURNAL.md covers the kernel's last words.
[Journal]
Storage=volatile
RuntimeMaxUse=512M
RuntimeKeepFree=1G
SyncIntervalSec=5min
