# FFN's SOC-property overrides for the BCM88375.
#
# The vendor's config.bcm is VENDOR CONTENT: it is used in place and never
# packaged, never edited. What FFN owns is this delta -- the properties our own
# build needs set differently, each with the reason it is here. Applied to a
# working COPY of the vendor tree by ffn-bcm-stage-config.sh.
#
# Format: key=value, one per line. A key already present in config.bcm is
# replaced in place; a key that is absent is appended. Anything after '#' is a
# comment.

# ---------------------------------------------------------------------------
# load_firmware -- THIS IS WHAT MADE ANY PORT ON THIS CHIP LINK AT ALL.
# ---------------------------------------------------------------------------
# The vendor ships 0x2 = phymodFirmwareLoadMethodExternal: the SerDes microcode
# is pushed into XLPORT_WC_UCMEM over the S-channel and shifted into PRAM by
# hardware. Fast, and in our OpenBCM 6.5.26 build it does not work. The bytes
# land -- eagle_tsc_ucode_load_verify reads them back and passes -- but the
# DW8051 microcontroller never starts, so every receiver on the chip stays
# unadapted and NOTHING links. Not the 40G dataplane ports, not the 10G
# management links, nothing. The only port that ever read `up` was xl2, which is
# wired to itself in PHY loopback and does not need the microcontroller.
#
# 0x1 = phymodFirmwareLoadMethodInternal takes the other path in
# _tsce_core_firmware_load: eagle_tsc_ucode_mdio_load, straight down the PMD
# register bus. It costs about 8 seconds more init. With it:
#
#   UC_ATV 1   COM_CLK 156.25MHz   UCODE_VER D10F_13   PLL_LOCK 1
#
# ...and xl24 (the dataplane 40G) and xe8/xe9 (the management 10G) came up, with
# real frames counted at the chip.
#
# Note the vendor knew something was wrong here. config.bcm carries their own
# comment that the checksum-enabled value "causes firmware load errors", so they
# cleared the verify bits rather than resolve it -- which is exactly why our
# build reported `init_errors: []` for a chip whose SerDes were dead. The top
# byte of this property is the verify flag (jer_nif.c:1326); 0x101 would keep
# MDIO load AND re-enable the check.
#
# BLAST RADIUS -- this is not a TSCE-only setting despite being a TSCE fix.
# jer_nif.c reads this property at three sites and the base key is the fallback
# for all of them: 1325 (PM4x10/TSCE, the 10G+40G macros), 1127 (PM4x25/TSCF,
# the CAUI/100G macros including ce12/HSCI), and 3453 (fabric -- where External
# additionally enables a BROADCAST firmware download that 0x1 turns off). So
# part of the extra init time is the lost broadcast, not just slow MDIO, and a
# future 100G or fabric problem will not obviously trace back to a line
# documented as a SerDes microcode fix.
#
# It can be narrowed if needed: load_firmware_quad<N> is per-quad and
# load_firmware_fabric is per-block. Left chip-wide because the ports work.
#
# The underlying PRAM defect is not fixed, only avoided. See bcm/SERDES-FIRMWARE.md.
load_firmware.BCM88650=0x1

# ---------------------------------------------------------------------------
# Port 8 (management-plane link 0) ingress header: TM -> RAW
# ---------------------------------------------------------------------------
# On a tm_port_header_type_in=TM port the chip reads the first FOUR BYTES of
# every frame as a Traffic Manager header and takes the forwarding destination
# from it. The management plane sends ordinary Ethernet, so its destination MAC
# gets parsed as a destination -- and every frame fails enqueue with "queue not
# valid". That is not a malfunction; it is the port doing exactly what it is
# configured to do.
#
# ffn_bcm_voq.c hit this same wall on port 5 and records it as a prerequisite:
# "port 5 must be in=RAW -- on a TM port the frame's first bytes are parsed as
# an ITMH, which is what made every packet fail enqueue".
#
# RAW makes port 8 accept plain Ethernet, which is what lets the MP be a free
# continuous traffic source with no cooperation and no generator.
#
# Only the INGRESS direction changes. tm_port_header_type_out_8 is already RAW,
# so nothing is prepended on the way back either.
#
# This does not affect the MP link itself -- it is up and counting frames
# today, and nothing currently forwards from it, so there is no behaviour to
# disturb.
tm_port_header_type_in_8.BCM88650=RAW

# ---------------------------------------------------------------------------
# The four RJ45 ports: attach the BCM84848 copper PHY
# ---------------------------------------------------------------------------
# ethernet1/1..1/4 are bcm ports 28, 13, 14, 15 (XE32-35 on core_1). They sit
# behind a BCM84848 quad 10GBase-T PHY on the switch's EXTERNAL MDIO, and the
# vendor's config declares no PHY for them at all -- no portmap, no phy_*, no
# xphy -- so the SDK believes they are direct SerDes ports and never drives the
# copper PHY. Enabling them and setting speed brings the MAC up and leaves the
# link down with no rate resolved, which is exactly what a configured MAC with
# nothing answering looks like.
#
# THE ADDRESSES ARE NOT GUESSED. They come from the vendor's own libports.so,
# symbol `gryphon_phy_addrs`, a 16-byte .data object at vaddr 0x100405d0:
#
#     100405d0  00000011 00000010 00000013 00000012
#
# So the quad occupies MDIO 0x10-0x13, listed pair-swapped. The mapping below
# assumes that array is in faceplate order (eth1/1..1/4); that ordering is the
# one part NOT established from the binary, and it is verified on hardware by
# reading each PHY's identifier and checking which port links against the
# operator's eth1/1 <-> eth1/3 cable.
#
# This also needs INCLUDE_PHY_8481 in the bcm.user build. Upstream OpenBCM does
# not list 8481 in BCM_PHY_LIST for DCMN chips -- only for the other family --
# so the driver was simply absent from our binary while 84740, 54684, 82764 and
# others were present. phy8481.c handles BCM84848 explicitly and ships its
# firmware in phy8481_firmware.c.
port_phy_addr_xe28.BCM88650=0x11
port_phy_addr_xe13.BCM88650=0x10
port_phy_addr_xe14.BCM88650=0x13
port_phy_addr_xe15.BCM88650=0x12
