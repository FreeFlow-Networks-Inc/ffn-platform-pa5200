# FFN: nginx serves nothing over plaintext HTTP.
#
# nginx is NOT part of the FFN appliance image -- it is present for the OpenWrt
# package mirror the CP installs from (octeon/cproot/ffn-owrt-mirror.conf, which
# listens on 127.1.1.1:8080). Installing it also enabled the distro's stock
# default site: `listen 80 default_server` serving
# /var/www/html/index.nginx-debian.html, which belongs to nothing FFN runs and
# advertises the server and distribution to whoever can reach it.
#
# HOW EXPOSED WAS IT, HONESTLY. Not very, and the reason matters. ffn-bmfw's
# input chain is `policy drop` with
#
#   iifname { enp15s0, enp16s0, enp17s0, ztbtov4b2k } tcp dport { 22, 443, 8443 } accept
#
# so :80 is already dropped on every management interface. This is defence in
# depth, not the closing of an open door. It is still worth having: the listener
# existed for no reason, opt/ffn_mgmt_bind.py records a period when ffn-bmfw was
# inactive and `nft list ruleset` was empty, and a service that serves nothing is
# the cheapest possible thing to remove.
#
# WHY 8443 AND NOT 443. The management UI is uvicorn with its own TLS
# (CN=ffn-ngfw, /etc/ffn-ngfw/tls/server.crt) on 8443. Nothing listens on 443,
# so redirecting there would send every client to a closed port.
#
# Note the mismatch this exposes: the mgmt allow-list above permits 443, and
# ffn_bmfw.py maps an interface-management profile's permit_https to 443/8443 --
# but 443 is dead. Anyone reaching for https://<box>/ gets connection refused
# and has to know to add :8443. Putting the manager on 443 is the real fix and
# is a separate change, because it means either moving uvicorn or fronting it.
#
# The manager is deliberately NOT proxied through nginx. Its TLS is already
# correct, proxying would add a second place TLS is configured, and it would make
# every request appear to come from 127.0.0.1 -- which the per-interface model in
# opt/ffn_mgmt_bind.py and opt/ffn_bmfw.py depends on being the real client.
#
# Install: link into /etc/nginx/sites-enabled/ and remove the stock `default`.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Do not advertise the server or its version to an unauthenticated client.
    server_tokens off;

    # $host follows whichever address or name the operator actually used.
    return 301 https://$host:8443$request_uri;
}
